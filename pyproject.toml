[project]
name = "trading-research"
version = "0.1.0"
description = "Multi-agent AI trading research system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "coordinators*", "data*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
